# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name porport.site www.porport.site;

    return 301 https://$host$request_uri;
}

# HTTPS - Main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name porport.site www.porport.site;

    # SSL certificate (Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/porport.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/porport.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Frontend static files (React + Vite build output)
    root  /var/www/pet-blog-post/pet-blog-post/dist;
    index index.html;

    # ─── API Proxy ───────────────────────────────────────────────────────────
    # Proxy /posts, /auth, /user  →  Express backend (port 4001)
    location ~ ^/(posts|auth|user)(/.*)?$ {
        proxy_pass         http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ─── Frontend SPA ────────────────────────────────────────────────────────
    # React Router fallback — ทุก route ที่ไม่ใช่ไฟล์จริงให้ไป index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Static Asset Caching ────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;
}
