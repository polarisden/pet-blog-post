name: Deploy to Ubuntu with PM2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./pet-blog-post-db
        run: npm install

      - name: Run backend tests (optional)
        if: false
        working-directory: ./pet-blog-post-db
        run: npm test

      - name: Install frontend dependencies
        working-directory: ./pet-blog-post
        run: npm install

      - name: Build frontend
        working-directory: ./pet-blog-post
        run: npm run build

      - name: Copy project to server and restart with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # เปลี่ยนเป็น path โปรเจกต์บนเซิร์ฟเวอร์ของคุณ
            APP_DIR=/var/www/pet-blog-post

            if [ ! -d "$APP_DIR" ]; then
              mkdir -p "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ถ้าโฟลเดอร์ .git ยังไม่มี ให้ clone ครั้งแรก
            if [ ! -d ".git" ]; then
              git clone ${{ secrets.REPO_SSH_URL }} .
            else
              git pull origin main
            fi

            # ติดตั้ง backend และ restart PM2
            cd pet-blog-post-db
            npm install --production

            # เปลี่ยนชื่อ app ตามที่คุณใช้ในเซิร์ฟเวอร์
            pm2 startOrReload ecosystem.config.cjs --only pet-blog-api || pm2 restart pet-blog-api

            # ติดตั้งและ build frontend (ถ้ารันด้วย PM2/Node)
            cd ../pet-blog-post
            npm install --production
            npm run build

            # ถ้าคุณ serve frontend ด้วย PM2 (เช่นผ่าน Express/serve)
            # เปลี่ยนชื่อ app ให้ตรงกับใน ecosystem.config.cjs
            pm2 startOrReload ecosystem.config.cjs --only pet-blog-frontend || pm2 restart pet-blog-frontend
