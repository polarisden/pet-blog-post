name: Deploy to Ubuntu with PM2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Copy project to server and restart with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # เปลี่ยนเป็น path โปรเจกต์บนเซิร์ฟเวอร์ของคุณ
            APP_DIR=/var/www/pet-blog-post

            # เตรียมโฟลเดอร์ SSH และเพิ่ม host key ของ GitHub (แก้ Host key verification failed)
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

            if [ ! -d "$APP_DIR" ]; then
              mkdir -p "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ถ้าโฟลเดอร์ .git ยังไม่มี ให้ clone ครั้งแรก
            if [ ! -d ".git" ]; then
              git clone ${{ secrets.REPO_SSH_URL }} .
            else
              git pull origin main
            fi

            # ติดตั้งและ build frontend จาก root โปรเจกต์
            npm install --production
            npm run build
